name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Code scanning needs GitHub Advanced Security on a private repo, which this
    # fork does not have: the SARIF upload is rejected with "Resource not
    # accessible by integration". Skip the job while the repo is private rather
    # than fail every run; it resumes by itself if the repo is ever made public.
    if: ${{ !github.event.repository.private }}
    permissions:
      # Job-level permissions REPLACE the workflow-level block rather than
      # merging with it, so omitting contents: read here left the token unable
      # to clone a private repo — checkout failed with "repository not found"
      # before CodeQL ran at all.
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
